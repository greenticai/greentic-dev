name: Dev Publish

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 1 — tests + version stamping. Outputs the stamped dev version
  # consumed by binaries + publish. Form is M.m.p-dev.{RUN_ID} for
  # dual-role repos (require-pre-release: true) so dev library publishes
  # sort below stable on crates.io; M.m.{RUN_ID} regular release for
  # binary-only repos (no stable namespace to protect) and pure libraries.
  dev-prepare:
    uses: greenticai/.github/.github/workflows/dev-prepare.yml@main
    with:
      setup-script: "if ! command -v cargo-binstall >/dev/null 2>&1; then ( set -o pipefail; curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash ); fi && cargo binstall -y greentic-flow greentic-component greentic-pack --force"
      require-pre-release: true

  dev-binaries-greentic-dev:
    needs: dev-prepare
    uses: greenticai/.github/.github/workflows/dev-release-binaries.yml@main
    with:
      package: greentic-dev
      version: ${{ needs.dev-prepare.outputs.binary-version }}
      rust-version: "1.96.0"
      include-macos-intel: true

  dev-publish:
    needs: [dev-prepare, dev-binaries-greentic-dev]
    uses: greenticai/.github/.github/workflows/dev-publish.yml@main
    with:
      version: ${{ needs.dev-prepare.outputs.version }}
      crates: "greentic-dev"
      binary-version: ${{ needs.dev-prepare.outputs.binary-version }}
      setup-script: "if ! command -v cargo-binstall >/dev/null 2>&1; then ( set -o pipefail; curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash ); fi && cargo binstall -y greentic-flow greentic-component greentic-pack --force"
      binary-crates: "greentic-dev"
      dual-role-binary-crates: "greentic-dev"
      require-pre-release: true
    secrets: inherit
